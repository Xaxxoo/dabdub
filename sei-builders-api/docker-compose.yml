version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sei-builders-api
    restart: unless-stopped
    env_file: .env
    ports:
      - '${PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sei-builders-network

  postgres:
    image: postgres:16-alpine
    container_name: sei-builders-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sei_builders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sei_builders_secret}
      POSTGRES_DB: ${DB_DATABASE:-sei_builders_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-sei_builders} -d ${DB_DATABASE:-sei_builders_hub}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sei-builders-network

  redis:
    image: redis:7-alpine
    container_name: sei-builders-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sei-builders-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sei-builders-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - sei-builders-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sei-builders-network:
    driver: bridge
